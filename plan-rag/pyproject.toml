[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-rag"
version = "0.1.0"
description = "Local retrieval and workflow service for canonical project plans"
requires-python = ">=3.12,<3.14"
dependencies = [
    # mcp 2.x renames FastMCP to MCPServer; plan_rag.mcp_server uses the v1 API.
    "mcp<2",
    "pydantic>=2",
    "chromadb>=1.5.9",
    "watchdog",
    "FlagEmbedding>=1.4.2",
    "torch",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
plan-rag = "plan_rag.cli:main"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    "linux-64",
    "osx-arm64",
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12" },
]

[tool.pixi.dependencies]
python = "3.13.*"
# conda-forge pytorch pulls in fsspec, and every PyPI datasets release (needed by
# FlagEmbedding) caps fsspec below the newest conda-forge build; without this cap
# the solver silently falls back to FlagEmbedding 1.2 and a broken datasets 1.x.
fsspec = "<=2026.7.0"

[tool.pixi.pypi-dependencies]
plan-rag = { path = ".", editable = true }

# torch comes from conda-forge, not PyPI, and satisfies the `torch` requirement
# above. pixi hardlinks conda packages from one shared cache, so every pixi
# project that pins this same pytorch build shares a single copy on disk; the
# heavy libtorch and CUDA packages do not depend on the Python version, so even
# projects on another Python share them. Keep this pin in step with the other
# projects that use torch.
[tool.pixi.feature.cuda]
platforms = ["linux-64-cuda"]
dependencies = { pytorch = { version = "==2.14.1", build = "cuda*" } }

[tool.pixi.feature.cpu]
platforms = ["linux-64", "osx-arm64"]
dependencies = { pytorch = { version = "==2.14.1", build = "cpu*" } }

# plan-rag.sh uses `default` when an NVIDIA driver is present, `cpu` otherwise.
[tool.pixi.environments]
default = ["cuda"]
cpu = ["cpu"]
dev = ["cuda", "dev"]

[tool.setuptools]
packages = ["plan_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local external services",
]
