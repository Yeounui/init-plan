[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-rag"
version = "0.1.0"
description = "Local retrieval and workflow service for canonical project plans"
requires-python = ">=3.12,<3.14"
dependencies = [
    # mcp 2.x renames FastMCP to MCPServer; plan_rag.mcp_server uses the v1 API.
    "mcp<2",
    "pydantic>=2",
    "chromadb>=1.5.9",
    "watchdog",
    "FlagEmbedding",
    "torch",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
plan-rag = "plan_rag.cli:main"

[tool.uv]
# Build .venv on a uv-managed CPython, so the repo does not depend on a
# system or conda interpreter being present.
python-preference = "managed"

# The lock stays reproducible for everything except torch: pointing it at the
# CPU index keeps pinned CUDA wheels out of uv.lock. torch itself is skipped
# during `uv sync` and installed with `--torch-backend=auto`, which reads the
# local driver and fetches the CUDA build that matches it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.setuptools]
packages = ["plan_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local external services",
]
