[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-rag"
version = "0.1.0"
description = "Local retrieval and workflow service for canonical project plans"
requires-python = ">=3.12,<3.14"
dependencies = [
    # mcp 2.x renames FastMCP to MCPServer; plan_rag.mcp_server uses the v1 API.
    "mcp<2",
    "pydantic>=2",
    "chromadb>=1.5.9",
    "watchdog",
    "FlagEmbedding",
    "torch",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
plan-rag = "plan_rag.cli:main"

[tool.uv]
# Build .venv on a uv-managed CPython, so the repo does not depend on a
# system or conda interpreter being present.
python-preference = "managed"

# PyPI's default torch is built against CUDA 13 and silently falls back to CPU
# on any driver older than that. Take the CUDA 12.8 build on Linux instead: it
# runs on 12.8+ drivers and on CUDA 13 ones. macOS keeps the PyPI wheel, which
# is the only one published there.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.setuptools]
packages = ["plan_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local external services",
]
