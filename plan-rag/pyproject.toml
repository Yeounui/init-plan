[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-rag"
version = "0.1.0"
description = "Local retrieval and workflow service for canonical project plans"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "pydantic>=2",
]

[project.optional-dependencies]
index = [
    "chromadb",
    "watchdog",
]
bge = [
    "FlagEmbedding",
    "torch",
]
test = [
    "pytest",
]

[project.scripts]
plan-rag = "plan_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local external services",
]
